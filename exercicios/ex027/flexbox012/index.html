<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible Box</title>
    <style>
        div.container {
            background-color: lightcoral;

            display: flex;
            flex-flow: row nowrap;
        }

        div.item {
            background-color: lightblue;
            border: 1px solid black;
            text-align: center;
        }

        div#caixa_a {
            /* flex-shrink: 1;
            flex-grow: 0;
            flex-basis: 200px; */

            flex: 0 1 200px;
        }

        div#caixa_b {
            /* flex-shrink: 1;
            flex-grow: 2;
            flex-basis: 200px; */
            
            flex: 2 1 150px;
        }

        div#caixa_c {
            /* flex-shrink: 1;
            flex-grow: 4;
            flex-basis: auto; */

            flex: 4 1 auto;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item" id="caixa_a">A</div>
        <div class="item" id="caixa_b">B</div>
        <div class="item" id="caixa_c">C</div>
    </div>
</body>
</html>
